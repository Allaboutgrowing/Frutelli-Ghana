<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#087b35">

    <title>Page Not Found | Frutelli Ghana</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #183b27;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
        }

        .error-box {
            max-width: 500px;
        }

        .error-code {
            font-size: 100px;
            font-weight: 900;
            color: #087b35;
        }

        h1 {
            margin-bottom: 15px;
            font-size: 28px;
        }

        p {
            color: #69756d;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            background: #087b35;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: bold;
        }

        a:hover {
            background: #064d27;
        }
    </style>
</head>

<body>

    <div class="error-box">
        <div class="error-code">404</div>

        <h1>Oops! Page Not Found</h1>

        <p>
            The page you're looking for may have moved
            or is temporarily unavailable.
        </p>

        <a href="./">Return to Homepage</a>
    </div>

</body>
</html>
